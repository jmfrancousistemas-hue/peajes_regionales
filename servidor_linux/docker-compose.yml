# Servidor Linux con Docker - Sistema de Peajes Regionales
# Proyecto Final de Sistemas Distribuidos (INTEP)
#
#   Puerto | Servicio                       | Acceso
#   8080   | App de peajes (Nginx + Node)   | Público (enlace por WhatsApp)
#   8090   | Mensajería ntfy                | Público
#   8081   | Documentos File Browser        | Público con usuario y clave
#   3000   | Monitor Grafana                | Público con usuario y clave
#   9090   | Prometheus                     | Solo administradores (VPN)
#   8082   | Adminer (base de datos)        | Solo administradores (VPN)

name: peajes

x-reinicio: &reinicio
  restart: unless-stopped

services:
  db:
    <<: *reinicio
    image: postgres:16-alpine
    container_name: peajes-db
    environment:
      POSTGRES_USER: ${DB_USER:-peajes}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-peajes}
      POSTGRES_DB: ${DB_NAME:-peajes}
      TZ: America/Bogota
    volumes:
      - db-datos:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-peajes} -d ${DB_NAME:-peajes}"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    <<: *reinicio
    build: ./app
    container_name: peajes-app
    environment:
      PGHOST: db
      PGUSER: ${DB_USER:-peajes}
      PGPASSWORD: ${DB_PASSWORD:-peajes}
      PGDATABASE: ${DB_NAME:-peajes}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASS: ${ADMIN_PASS:-admin123}
      NTFY_URL: http://ntfy
      NTFY_TOPIC: ${NTFY_TOPIC:-peajes-alertas}
      REPORTES_DIR: /app/reportes
      SALDO_MINIMO: "30000"
    volumes:
      - ./reportes:/app/reportes
    depends_on:
      db:
        condition: service_healthy

  nginx:
    <<: *reinicio
    image: nginx:1.27-alpine
    container_name: peajes-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  ntfy:
    <<: *reinicio
    image: binwiederhier/ntfy:latest
    container_name: peajes-ntfy
    command: serve
    environment:
      TZ: America/Bogota
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_CACHE_DURATION: 24h
      NTFY_BEHIND_PROXY: "true"
    ports:
      - "8090:80"
    volumes:
      - ntfy-cache:/var/cache/ntfy

  filebrowser:
    <<: *reinicio
    image: filebrowser/filebrowser:v2.27.0
    container_name: peajes-filebrowser
    # Crea la base de usuarios la primera vez con una clave conocida y la guarda en un volumen.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        DB=/database/filebrowser.db
        if [ ! -f "$$DB" ]; then
          /filebrowser config init -d "$$DB" --address 0.0.0.0 --port 80 --root /srv --locale es
          /filebrowser users add "$${FB_USER}" "$${FB_PASSWORD}" --perm.admin --locale es -d "$$DB"
        fi
        exec /filebrowser -d "$$DB"
    environment:
      FB_USER: ${FILEBROWSER_USER:-admin}
      FB_PASSWORD: ${FILEBROWSER_PASSWORD:-peajes2026admin}
    ports:
      - "8081:80"
    volumes:
      - ./reportes:/srv/reportes
      - ./documentos:/srv/documentos
      - filebrowser-datos:/database

  prometheus:
    <<: *reinicio
    image: prom/prometheus:v2.55.1
    container_name: peajes-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ./monitoreo/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-datos:/prometheus

  grafana:
    <<: *reinicio
    image: grafana/grafana:11.3.1
    container_name: peajes-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin123}
      GF_USERS_DEFAULT_LANGUAGE: es-ES
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/peajes.json
    ports:
      - "3000:3000"
    volumes:
      - ./monitoreo/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoreo/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-datos:/var/lib/grafana
    depends_on:
      - prometheus

  node-exporter:
    <<: *reinicio
    image: prom/node-exporter:v1.8.2
    container_name: peajes-node-exporter
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro

  cadvisor:
    <<: *reinicio
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: peajes-cadvisor
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=10s
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  adminer:
    <<: *reinicio
    image: adminer:4
    container_name: peajes-adminer
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8082:8080"
    depends_on:
      - db

volumes:
  db-datos:
  ntfy-cache:
  prometheus-datos:
  grafana-datos:
  filebrowser-datos:

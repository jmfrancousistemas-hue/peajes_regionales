global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Métricas de negocio: vehículos, recaudo, rechazos TAG, recargas, latencia API
  - job_name: app-peajes
    static_configs:
      - targets: ["app:3000"]

  # CPU, memoria, disco y red del servidor Linux
  - job_name: servidor-linux
    static_configs:
      - targets: ["node-exporter:9100"]

  # CPU, memoria y red de cada contenedor
  - job_name: contenedores
    static_configs:
      - targets: ["cadvisor:8080"]
